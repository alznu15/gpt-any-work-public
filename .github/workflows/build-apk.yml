name: Build LIFE RPG Android APK v0.4.0

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Bundle the current LIFE RPG command center
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp life-rpg/index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("life-rpg/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>(.*?)</script>", s, re.S)
          if not m:
              raise SystemExit("No app script found")
          Path("/tmp/life-rpg.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/life-rpg.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name the install package
        run: cp app/build/outputs/apk/debug/app-debug.apk LIFE-RPG-Android-v0.4.0.apk

      - name: Preserve the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-RPG-Android-v0.4.0
          path: LIFE-RPG-Android-v0.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: life-rpg-v0.4.0
          target_commitish: main
          name: LIFE RPG Android v0.4.0
          body: |
            LIFE RPG v0.4.0 adds the Command Center dashboard, interactive quest log, persistent local XP, focus timer, weekly schedule, skills/evidence locker, data-connection status, and reward/control policy preview.
            This is a debug-signed preview APK. Local progress is stored on-device. Google account sync, Gemini backend, cloud persistence, push notifications, and Windows control agent are not connected yet.
          files: LIFE-RPG-Android-v0.3.0.apk
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
