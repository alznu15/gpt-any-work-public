name: Build LIFE RPG Android APK v0.6.1

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'life-rpg/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Bundle the current LIFE RPG command center
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/engine app/src/main/assets/data
          cp life-rpg/index.html app/src/main/assets/index.html
          cp life-rpg/engine/rpg-engine.js app/src/main/assets/engine/rpg-engine.js
          cp life-rpg/data/opportunities-seed.js app/src/main/assets/data/opportunities-seed.js
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/engine/rpg-engine.js
          test -s app/src/main/assets/data/opportunities-seed.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path("life-rpg/index.html").read_text(encoding="utf-8")
          m = re.search(r"<script>(.*?)</script>", s, re.S)
          if not m:
              raise SystemExit("No app script found")
          Path("/tmp/life-rpg.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/life-rpg.js

      - name: Test LIFE RPG scoring and challenge rules
        run: node --test life-rpg/engine/rpg-engine.test.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name the install package
        run: cp app/build/outputs/apk/debug/app-debug.apk LIFE-RPG-Android-v0.6.1.apk

      - name: Preserve the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-RPG-Android-v0.6.1
          path: LIFE-RPG-Android-v0.6.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: life-rpg-v0.6.1
          target_commitish: main
          name: LIFE RPG Android v0.6.1
          body: |
            LIFE RPG v0.6.1 makes the updated XP rules visible in the app and adds a searchable opportunity/dungeon atlas, provisional skill-benchmark recording, readiness estimates, score reporting, printable challenge cards, versioned cache assets, and a visible build label.
            這是 debug 簽章的試用 APK。任務勾選不直接發 XP；XP 依專注時間、難度、完成比例與成果證據計算。副本目錄為 11 筆附來源的靜態樣本，技能基準是本機暫估。即時 AI 搜尋、AI 批改、Google 同步、雲端資料庫與 Windows 管控代理程式尚未接通。進度保存在本機。
          files: LIFE-RPG-Android-v0.6.1.apk
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
